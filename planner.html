<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrian Chronicles Planner</title>
<!--
  Lyrian Chronicles Character Planner (offline). Open license, community tool.
  HOW IT WORKS
  - Keep this file next to the "data" folder. Open it in any browser (double-click). No internet needed.
  - All game data lives in data/*.js. Update those files when the game updates; this page reads them.
  - Your build saves automatically in this browser. Use Save to download a .json copy, Load to open one.
-->
<style>
:root{
  --bg:#1b1d22; --panel:#252830; --panel2:#2d3039; --line:#3a3e49; --text:#e6e3db; --dim:#9da1ab;
  --gold:#c9a24a; --gold2:#e2c072; --good:#6fbf73; --bad:#e06c5e; --warn:#e0b24e; --blue:#79a8d8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.gold{background:var(--gold);color:#1b1d22;border-color:var(--gold);font-weight:600}
button.small{padding:1px 7px;font-size:12px}
button.danger{border-color:#6b3a35}
input[type=text],input[type=number],input[type=search],select{background:#1f2128;border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=number]{width:80px}
input:focus,select:focus{outline:1px solid var(--gold)}
h1{font-size:18px;margin:0;color:var(--gold2);letter-spacing:.5px}
h2{font-size:15px;margin:0 0 10px;color:var(--gold2);text-transform:uppercase;letter-spacing:1px}
h3{font-size:14px;margin:12px 0 6px;color:var(--gold)}
a{color:var(--blue)}
.dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:12px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#16181c;position:sticky;top:0;z-index:5}
header .spacer{flex:1}
header .reset{margin-left:18px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px 360px;gap:14px;padding:14px 16px;align-items:start}
.pane{position:sticky;top:62px;max-height:calc(100vh - 76px);overflow:auto}
@media (max-width:1250px){.layout{grid-template-columns:minmax(0,1fr) 300px}.pane.abil{grid-column:1 / -1;position:static;max-height:none}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr);padding:10px}.pane{position:static;max-height:none}header{position:static}}
.scrollx{overflow-x:auto;max-width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.row2{grid-template-columns:1fr}}
.field{display:flex;align-items:center;gap:8px;margin:5px 0}
.field label{min-width:92px;color:var(--dim)}
.field select,.field input[type=text]{flex:1;min-width:0}
.note{font-size:12px;color:var(--dim);margin:4px 0}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--dim);margin-left:4px;white-space:nowrap}
.tag.gold{border-color:var(--gold);color:var(--gold2)}
.tag.bad{border-color:#6b3a35;color:var(--bad)}
.tag.warn{border-color:#6b5a30;color:var(--warn)}
.tag.good{border-color:#365e38;color:var(--good)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #30333c;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.statgrid td:first-child{width:90px}
.statgrid select{width:58px}
.final{font-weight:700;color:var(--gold2);font-size:15px}

.list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.li{padding:7px 9px;border-bottom:1px solid #30333c}
.li:last-child{border-bottom:none}
.li .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .name{font-weight:600}
.li .grow{flex:1}
.li details{margin-top:4px}
.li summary{cursor:pointer;color:var(--dim);font-size:12px}
.li ul{margin:4px 0 0 0;padding-left:18px}
.li.locked .name{color:var(--dim)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.toolbar input[type=search]{flex:1;min-width:160px}

.cls{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--panel2)}
.cls .head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cls .head .name{font-weight:700;color:var(--gold2)}
.step{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;border-bottom:1px solid #383c47}
.step:last-child{border-bottom:none}
.step .lv{width:22px;color:var(--dim);text-align:right}
.step .body{flex:1}
.step .cost{color:var(--dim);font-size:12px;white-space:nowrap}
.step.owned .body .nm{color:var(--text)}
.step:not(.owned) .body{color:var(--dim)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;background:#1f2128;font-size:12px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.chip .left{font-weight:700;margin-left:4px}
.chip.alert{box-shadow:0 0 0 1px var(--warn) inset}
.pm{display:inline-flex;gap:3px}
tr.off td{color:#6c707a}
tr.can td:first-child{color:var(--gold2)}

.pane .card{padding:12px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed #33363f}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.big div{background:#1f2128;border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center}
.big b{display:block;font-size:18px;color:var(--gold2)}
.big span{font-size:11px;color:var(--dim)}
.inv .kv{align-items:center}

.ab{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;background:var(--panel2)}
.ab .t{font-weight:600}
.ab .meta{font-size:12px;color:var(--dim)}
.ab ul{margin:4px 0 0;padding-left:18px}
.ab .src{font-size:11px;color:var(--gold)}
.warnbox{border:1px solid #6b5a30;background:#2c2717;color:var(--warn);border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
.tag.kw{border-color:#4a5468;color:#b9c3d6;cursor:help}
.tag.kw:hover{border-color:var(--gold);color:var(--gold2)}
header .hlink{font-size:13px;color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px}
header .hlink:hover{border-color:var(--gold);color:var(--gold2)}
[data-info]{cursor:pointer}
.name[data-info]:hover{color:var(--gold2);text-decoration:underline}
.ibtn{padding:1px 8px;font-size:13px;line-height:1.3}
#detail{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px}
#detail.open{display:flex}
#detail .box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;width:100%;max-width:720px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#detail .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
#detail .dh .t{font-size:17px;font-weight:700;color:var(--gold2)}
#detail .db{padding:12px 14px;overflow:auto}
#detail .df{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
#detail .stp{border-left:2px solid var(--line);padding:4px 0 6px 10px;margin:6px 0}
#detail .stp .lbl{font-size:12px;color:var(--dim)}
@media (max-width:820px){#detail{padding:0}#detail .box{max-height:100vh;height:100vh;border-radius:0;max-width:none}}
#kwPop{position:fixed;z-index:40;max-width:320px;background:#16181c;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
#kwPop b{color:var(--gold2)}
#kwPop ul{margin:4px 0 0;padding-left:18px}
.errbox{border:1px solid #6b3a35;background:#2c1b19;color:var(--bad);border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
</style>

<!-- Game data (edit these files, not this page, when the game updates) -->
<script src="data/classes.js"></script>
<script src="data/races.js"></script>
<script src="data/breakthroughs.js"></script>
<script src="data/requirements.js"></script>
<script src="data/items.js"></script>
<script src="data/keywords.js"></script>
<script src="data/proficiencies.js"></script>
</head>
<body>

<header>
  <h1>Lyrian Chronicles Planner</h1>
  <span id="hdrName" class="dim"></span>
  <a class="hlink" href="https://rpg.angelssword.com/" target="_blank" rel="noopener">Official site</a>
  <a class="hlink" href="https://lyrian.splatpass.net/" target="_blank" rel="noopener" title="Unofficial static copy of the rules. The planner's data was checked against it (v0.13.2).">Static copy (unofficial)</a>
  <span class="spacer"></span>
  <span id="dataVer" class="dim small"></span>
  <button id="btnSave" class="gold">Save</button>
  <button id="btnLoad">Load</button>
  <input id="fileLoad" type="file" accept=".json,application/json" hidden>
  <button id="btnReset" class="reset danger">Reset</button>
</header>

<div class="layout">
  <main>
    <div id="dataErr"></div>
    <div class="row2">
      <section class="card" id="cardIdentity"></section>
      <section class="card" id="cardStats"></section>
    </div>
    <section class="card" id="cardClasses"></section>
    <section class="card" id="cardSkills"></section>
    <section class="card" id="cardProf"></section>
    <section class="card" id="cardBreak"></section>
    <section class="card" id="cardItems"></section>
  </main>
  <aside class="pane live" id="paneLive"></aside>
  <aside class="pane abil" id="paneAbil"></aside>
</div>

<div id="kwPop"></div>
<div id="detail"><div class="box"><div class="dh" id="dHead"></div><div class="db" id="dBody"></div><div class="df" id="dFoot"></div></div></div>
<script>
/* =====================================================================
   0. SETUP AND SMALL HELPERS
   ===================================================================== */
var LC = window.LC || {};
var CLASSES = LC.classes || {}, RACES = LC.races || {}, BTS = LC.breakthroughs || {},
    REQS = LC.requirements || {}, ITEMS = LC.items || {}, UNLOCKS = LC.raceClassUnlocks || [],
    KEYWORDS = LC.keywords || {};
var SAVE_KEY = "lyrianPlanner.v1";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function sortByName(a, b){ return a.name.localeCompare(b.name); }
function fmt(n){ return (Math.round(n * 10) / 10).toLocaleString(); }
function sign(n){ return (n >= 0 ? "+" : "") + n; }
function listHtml(arr){
  if (!arr || !arr.length) return "";
  return "<ul>" + arr.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
}

var MAIN = ["Power", "Focus", "Agility", "Toughness"];
var SUB  = ["Fitness", "Cunning", "Reason", "Awareness", "Presence"];
var MAIN_ARRAY = [5, 4, 4, 3];
var SUB_ARRAY  = [5, 4, 3, 2, 1];

// Skill list. kind: main = the normal skills, craft = crafting, gather = gathering.
var SKILLS = [
  ["Athletics","Fitness","main"],["Riding","Fitness","main"],
  ["Deception","Cunning","main"],["Roguecraft","Cunning","main"],["Stealth","Cunning","main"],
  ["Appraise","Reason","main"],["Artifice","Reason","main"],["Common Knowledge","Reason","main"],
  ["Flight","Reason","main"],["History","Reason","main"],["Linguistics","Reason","main"],
  ["Magic","Reason","main"],["Medicine","Reason","main"],["Religion","Reason","main"],
  ["Animal Husbandry","Awareness","main"],["Insight","Awareness","main"],
  ["Perception","Awareness","main"],["Survival","Awareness","main"],
  ["Art","Presence","main"],["Intimidation","Presence","main"],["Negotiation","Presence","main"],
  ["Expert Knowledge","","main"],
  ["Alchemy","","craft"],["Armorsmithing","","craft"],["Artificing","","craft"],
  ["Blacksmithing","","craft"],["Carpentry","","craft"],["Culinary","","craft"],["Farming","","craft"],
  ["Foraging","","gather"],["Mining","","gather"]
].map(function(a){ return {name:a[0], stat:a[1], kind:a[2]}; });
var SKILL = {}; SKILLS.forEach(function(s){ SKILL[s.name] = s; });

// Turn a data "options" value into a list of skill names.
function skillOptions(opt){
  if (Array.isArray(opt)) {
    return opt.map(function(o){ return /^Expert Knowledge/.test(o) ? "Expert Knowledge" : o; })
              .filter(function(o){ return SKILL[o]; });
  }
  var main = SKILLS.filter(function(s){ return s.kind === "main"; }).map(function(s){ return s.name; });
  var gather = SKILLS.filter(function(s){ return s.kind === "gather"; }).map(function(s){ return s.name; });
  if (opt === "ANY_NON_CRAFTING_NON_GATHERING") return main;
  if (opt === "ANY_NON_CRAFTING") return main.concat(gather);
  if (opt === "ANY_REASON_AWARENESS_OR_PRESENCE_SKILL")
    return SKILLS.filter(function(s){ return ["Reason","Awareness","Presence"].indexOf(s.stat) >= 0; }).map(function(s){ return s.name; });
  return main;
}

/* =====================================================================
   1. THE BUILD (everything that gets saved)
   ===================================================================== */
function newBuild(){
  return {
    v: 1,
    name: "", gender: "", race: "", subrace: "", canon: false,
    raceChoice: { clan: "", element: "", main: "", sub: "" },
    mainArr: { Power: 5, Focus: 4, Agility: 4, Toughness: 3 },
    subArr:  { Fitness: 5, Cunning: 4, Reason: 3, Awareness: 2, Presence: 1 },
    expEarned: 0, ipEarned: 0, startClim: 3000, climAdded: 0,
    classes: [],        // [{id, owned:[true x8], picks:{5:"Reason", 7:"Focus"}}] in purchase order
    bts: [],            // [{id, pick:{}}] in purchase order
    items: [],          // [{id, qty, equipped}]
    alloc: {},          // skill spending per source: {sourceId: {sk:{Skill:n}, ex:[{skill,name,pts}]}}
    activeSource: "start",
    profPicks: {},      // proficiency choices: {"class:fighter#0": ["Axes", ...]}
    notes: ""
  };
}
var B = loadLocal() || newBuild();
var ui = { classSearch: "", classTier: "", showLocked: false, btSearch: "", btOnlyOk: false,
           itemSearch: "", itemCat: "", exSkill: "", exName: "" };

function loadLocal(){
  try { var s = localStorage.getItem(SAVE_KEY); if (s) return fixBuild(JSON.parse(s)); } catch (e) {}
  return null;
}
function saveLocal(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(B)); } catch (e) {} }
function fixBuild(b){ // fill in anything missing from older saves
  var d = newBuild();
  for (var k in d) if (b[k] === undefined) b[k] = d[k];
  b.raceChoice = Object.assign(d.raceChoice, b.raceChoice || {});
  return b;
}

/* =====================================================================
   2. CALCULATIONS (everything the page shows is worked out here)
   ===================================================================== */
function raceRec(){ return RACES[B.race] || null; }
function subRec(){ return RACES[B.subrace] || null; }
// Race records that give stats/skills. Sub-races that "use parent creation" use the main race's.
function creationRace(){
  var s = subRec(), r = raceRec();
  if (s && !s.usesParentCreation && (s.stats || s.skills)) return s;
  return r;
}
function raceIds(){ // every race id this character counts as
  var a = []; if (B.race) a.push(B.race); if (B.subrace) a.push(B.subrace); return a;
}
function hasBt(id){ return B.bts.some(function(b){ return b.id === id; }); }
function btGrants(key){ return B.bts.map(function(b){ var r = BTS[b.id]; return r && r.grants ? {g:r.grants, b:b} : null; })
  .filter(function(x){ return x && x.g[key] !== undefined; }); }

function isMastered(c){ return c.owned.every(Boolean); }

// Free class levels given by race / clan (e.g. Demon clan Wi = Saboteur at level 1).
function raceUnlock(classId){
  var srcs = raceIds().map(function(r){ return "race:" + r; });
  if (B.race === "demon" && B.raceChoice.clan) srcs.push("clan:" + B.raceChoice.clan);
  var best = null;
  UNLOCKS.forEach(function(u){ if (u.classId === classId && srcs.indexOf(u.source) >= 0) best = u; });
  return best;
}

// EXP cost of one step of a class (step index 0..7)
function stepCost(classId, i){
  var c = CLASSES[classId]; if (!c) return 0;
  var u = raceUnlock(classId);
  if (u && u.level >= i + 1) return 0;
  if (i === 0) return c.tier * 100 - (u && u.level === 0 ? 100 : 0);
  return 100;
}
function classIpCost(classId){ var u = raceUnlock(classId); return (u && u.level >= 1) ? 0 : 1; }

function btCostAt(id, nth){ // nth = 0 for the first time you take it
  var r = BTS[id]; if (!r) return 0;
  if (r.costScale) return r.costScale[Math.min(nth, r.costScale.length - 1)];
  return num(r.cost);
}

function itemCost(it){ return typeof it.cost === "number" ? it.cost : null; }
function itemBurden(it){ return typeof it.burden === "number" ? it.burden : 0; }

function calc(){
  var C = { warn: [] };
  var cr = creationRace();

  // ---- stats ----
  var st = {};
  MAIN.forEach(function(s){ st[s] = num(B.mainArr[s]); });
  SUB.forEach(function(s){ st[s] = num(B.subArr[s]); });
  var bonus = {}; MAIN.concat(SUB).forEach(function(s){ bonus[s] = []; });
  function add(stat, n, why){ if (bonus[stat]) bonus[stat].push({n:n, why:why}); }
  if (cr && cr.stats) {
    for (var k in cr.stats) if (k !== "choice") add(k, cr.stats[k], cr.name);
    if (cr.stats.choice) {
      if (B.raceChoice.main) add(B.raceChoice.main, 1, cr.name); else C.warn.push(cr.name + ": pick your +1 main stat (Identity).");
      if (B.raceChoice.sub) add(B.raceChoice.sub, 1, cr.name); else C.warn.push(cr.name + ": pick your +1 sub stat (Identity).");
    }
  }
  B.classes.forEach(function(c){
    var rec = CLASSES[c.id]; if (!rec) return;
    rec.steps.forEach(function(s, i){
      if ((s.type === "heart" || s.type === "soul") && c.owned[i]) {
        var p = c.picks && c.picks[s.level];
        if (p) add(p, s.amount || 1, rec.name + " " + s.label);
        else C.warn.push(rec.name + ": pick a stat for the " + s.label + " step.");
      }
    });
  });
  B.bts.forEach(function(b){
    var r = BTS[b.id]; if (!r || !r.grants) return; var g = r.grants, p = b.pick || {};
    if (g.statChoice) { if (p.stat) add(p.stat, g.amount || 1, r.name); else C.warn.push(r.name + ": pick a stat."); }
    if (g.mainStatChoice) { if (p.main) add(p.main, g.mainStatChoice, r.name); else C.warn.push(r.name + ": pick a main stat."); }
    if (g.subStatChoice) { if (p.sub) add(p.sub, g.subStatChoice, r.name); else C.warn.push(r.name + ": pick a sub stat."); }
  });
  C.base = st; C.bonus = bonus; C.stat = {};
  MAIN.concat(SUB).forEach(function(s){
    C.stat[s] = st[s] + bonus[s].reduce(function(t, x){ return t + x.n; }, 0);
  });

  // ---- spirit core / EXP ----
  var classExp = 0, classCount = 0, ipSpent = 0;
  B.classes.forEach(function(c){
    if (!CLASSES[c.id]) return; classCount++; ipSpent += classIpCost(c.id);
    c.owned.forEach(function(o, i){ if (o) classExp += stepCost(c.id, i); });
  });
  var btExp = 0, seen = {};
  B.bts.forEach(function(b){ var n = seen[b.id] || 0; btExp += btCostAt(b.id, n); seen[b.id] = n + 1; });
  var human = raceIds().indexOf("human") >= 0 ? 100 : 0;
  var startClassExp = 1000 + btGrants("startingClassExp").reduce(function(t, x){ return t + x.g.startingClassExp; }, 0);
  C.exp = {
    startClass: startClassExp,
    startBt: 300,
    human: human,
    earned: num(B.expEarned),
    classSpent: classExp,
    btSpent: btExp,
    classOver: Math.max(0, classExp - startClassExp),
    btOver: Math.max(0, btExp - 300),
    classLeft: Math.max(0, startClassExp - classExp),
    btLeft: Math.max(0, 300 - btExp)
  };
  C.exp.general = C.exp.earned + human;
  C.exp.generalSpent = C.exp.classOver + C.exp.btOver;
  C.exp.unspent = C.exp.general - C.exp.generalSpent;
  C.exp.spiritCore = classExp + C.exp.btOver + human;  // the 300 breakthrough EXP is not added (rulebook)
  if (C.exp.unspent < 0) C.warn.push("You've spent " + (-C.exp.unspent) + " more EXP than you have. Add EXP earned or remove something.");

  // ---- IP ----
  C.ip = { total: 3 + num(B.ipEarned), spent: ipSpent };
  C.ip.left = C.ip.total - C.ip.spent;
  if (C.ip.left < 0) C.warn.push("Not enough IP for all your classes.");

  // ---- Clim and burden ----
  var climSpent = 0, burden = 0, unknownCost = [];
  B.items.forEach(function(e){
    var it = ITEMS[e.id]; if (!it) return;
    var c = itemCost(it); if (c === null) unknownCost.push(it.name); else climSpent += c * e.qty;
    burden += itemBurden(it) * e.qty;
  });
  var richClim = btGrants("clim").reduce(function(t, x){ return t + x.g.clim; }, 0);
  var canonClim = B.canon ? 1000 : 0;  // canon campaign: +1000 starting Clim
  C.clim = { start: num(B.startClim), added: num(B.climAdded), bonus: richClim, canon: canonClim, spent: climSpent, unknown: unknownCost };
  C.clim.left = C.clim.start + C.clim.added + C.clim.bonus + C.clim.canon - climSpent;
  C.burden = burden;
  if (unknownCost.length) C.warn.push("Price not a plain number, not counted: " + unknownCost.join(", "));
  if (C.clim.left < 0) C.warn.push("You're " + (-C.clim.left).toLocaleString() + " Clim over budget.");

  // ---- owned abilities (for requirements and the abilities pane) ----
  C.owned = {}; C.ownedNames = {};
  B.classes.forEach(function(c){
    var rec = CLASSES[c.id]; if (!rec) return;
    rec.steps.forEach(function(s, i){
      if (s.ability && c.owned[i]) {
        C.owned[c.id + "/" + s.ability] = true;
        var a = rec.abilities[s.ability]; if (a) C.ownedNames[a.name.toLowerCase()] = a;
      }
    });
  });
  C.mastered = B.classes.filter(function(c){ return CLASSES[c.id] && isMastered(c); }).map(function(c){ return c.id; });

  // ---- proficiencies ----
  calcProfs(C);

  // ---- skills ----
  calcSkills(C);

  // ---- derived combat values ----
  var arm = { guard: 0, block: 0, evasion: 0, dodge: 0, initiative: 0 }, shield = 0;
  B.items.forEach(function(e){
    var it = ITEMS[e.id]; if (!it || !it.armor || !e.equipped) return;
    if (it.tag === "Shield" || /shield/i.test(it.armor.type || "")) { shield += num(String(it.armor.block).replace("+", "")); return; }
    ["guard","block","evasion","dodge","initiative"].forEach(function(k){ arm[k] += num(it.armor[k]); });
  });
  var T = C.stat.Toughness, A = C.stat.Agility, P = C.stat.Power, F = C.stat.Focus;
  var mana = btGrants("maxMana").reduce(function(t, x){ return t + x.g.maxMana; }, 0);
  var spd = btGrants("speedBonus").reduce(function(t, x){ return t + x.g.speedBonus; }, 0);
  var ini = btGrants("initiative").reduce(function(t, x){ return t + x.g.initiative; }, 0);
  C.d = {
    hp: 20 + T * 10, mana: 6 + P + mana, ap: 4, rp: 2 + A,
    guard: arm.guard + T, blockGuard: 2 * T + arm.block + shield + arm.guard + 0,
    evasion: 7 + A + arm.evasion, dodge: 20 + A + (arm.dodge || arm.evasion),
    init: A + arm.initiative + ini, speed: 20 + spd, potency: 11 + F,
    save: "2d10 + " + T, acc: "1d20 + " + F, accP: "1d20 + " + (2 * F),
    light: "2d4 + " + P, heavy: "4d6 + " + (2 * P), heavy2: "5d6 + " + (2 * P)
  };
  // Block guard per rulebook: 2 x Toughness + armor Block value (shield +4). Armor Guard already counts in Guard.
  C.d.blockGuard = 2 * T + arm.block + shield;
  if (C.burden > 10) C.warn.push("Burden " + C.burden + " is over 10: you'd be Rooted.");
  return C;
}

/* ---------- Skill sources: every place that gives skill points ---------- */
function skillSources(){
  var out = [];
  out.push({ id: "start", label: "Starting points", points: 10, options: skillOptions("ANY_NON_CRAFTING_NON_GATHERING"),
             note: "10 points at character creation (normal skills only)." });
  var cr = creationRace();
  if (cr && cr.skills && cr.skills.points) {
    out.push({ id: "race", label: cr.name + " (race)", points: cr.skills.points, options: skillOptions(cr.skills.options),
               note: "Race skill points" + (cr.skills.pick === "UNCLEAR" ? " (the page doesn't say how they split - see ISSUES.md)." : ".") });
  }
  B.classes.forEach(function(c){
    var rec = CLASSES[c.id]; if (!rec) return;
    rec.steps.forEach(function(s, i){
      if (s.type === "skills" && c.owned[i])
        out.push({ id: "cls:" + c.id, label: rec.name, points: s.points, options: skillOptions(s.options), note: s.summary || "" });
    });
  });
  var n = {};
  B.bts.forEach(function(b, idx){
    var r = BTS[b.id]; if (!r || !r.grants || !r.grants.skillPoints) return;
    var excl = r.grants.excludes || "";
    var opts = /gathering/.test(excl) ? skillOptions("ANY_NON_CRAFTING_NON_GATHERING") : skillOptions("ANY_NON_CRAFTING");
    n[b.id] = (n[b.id] || 0) + 1;
    out.push({ id: "bt:" + idx, label: r.name + (n[b.id] > 1 ? " #" + n[b.id] : ""), points: r.grants.skillPoints, options: opts, note: (r.summary || []).join(" ") });
  });
  return out;
}
function allocOf(id){ if (!B.alloc[id]) B.alloc[id] = { sk: {}, ex: [] }; return B.alloc[id]; }
function srcUsed(a){
  var s = 0; for (var k in a.sk) s += a.sk[k];
  a.ex.forEach(function(e){ s += e.pts / 2; });
  return s;
}
function skillCap(sk, sc){
  var kind = SKILL[sk] ? SKILL[sk].kind : "main";
  if (kind === "craft") return 10;
  if (sc >= 10000) return 999;
  return sc >= 5000 ? 20 : 15;
}
function calcSkills(C){
  var srcs = skillSources(); C.sources = srcs;
  var ids = {}; srcs.forEach(function(s){ ids[s.id] = s; });
  // forget spending from sources that no longer exist (e.g. class removed)
  for (var k in B.alloc) if (!ids[k]) delete B.alloc[k];
  if (!ids[B.activeSource]) B.activeSource = srcs.length ? srcs[0].id : "start";
  C.pts = {}; C.ex = {}; C.srcLeft = {}; var leftTotal = 0;
  srcs.forEach(function(s){
    var a = allocOf(s.id);
    for (var sk in a.sk) C.pts[sk] = (C.pts[sk] || 0) + a.sk[sk];
    a.ex.forEach(function(e){
      var key = e.skill + "|" + e.name.trim().toLowerCase();
      if (!C.ex[key]) C.ex[key] = { skill: e.skill, name: e.name.trim(), pts: 0 };
      C.ex[key].pts += e.pts;
    });
    C.srcLeft[s.id] = s.points - srcUsed(a); leftTotal += C.srcLeft[s.id];
  });
  C.skillLeft = leftTotal;
  C.bestEx = {};
  for (var key in C.ex) { var e = C.ex[key]; if (!C.bestEx[e.skill] || C.bestEx[e.skill].pts < e.pts) C.bestEx[e.skill] = e; }
}

/* ---------- Requirement checking ----------
   Each class has routes (any one route works). Each route is a list of conditions (all needed).
   A condition is true (met), false (not met) or null (the planner can't check it - check yourself). */
function condCheck(c, C){
  if (c.ability) {
    if (C.owned[c.ability]) return true;
    var nm = c.ability.split("/")[1] || "";
    for (var r in RACES) { var rr = RACES[r]; if (rr.abilities && rr.abilities[nm] && raceIds().indexOf(r) >= 0) return true; }
    return false;
  }
  if (c.classLearned) return B.classes.some(function(x){ return x.id === c.classLearned; });
  if (c.mastered) return C.mastered.indexOf(c.mastered) >= 0;
  if (c.masteredAny) return C.mastered.length + earlyAscension() >= c.masteredAny;
  if (c.masteredTier) {
    // "any tier 2 class mastered" - counts tier 2 or higher. Early Ascension counts as one.
    var n = C.mastered.filter(function(id){ return CLASSES[id].tier >= c.masteredTier; }).length + earlyAscension();
    return n >= (c.count || 1);
  }
  if (c.race) {
    if (raceIds().indexOf(c.race) >= 0) return true;
    if (c.race === "human" && hasBt("the-unknown-paladin")) return true;
    return false;
  }
  if (c.breakthrough) return hasBt(c.breakthrough);
  if (c.skill) return (C.pts[c.skill] || 0) >= (c.points || 1);
  if (c.expertise) {
    var any = false;
    for (var k in C.ex) {
      var e = C.ex[k], label = (e.skill + " (" + e.name + ")").toLowerCase();
      var hit = c.expertise.some(function(x){
        x = x.toLowerCase(); return x === label || (x.indexOf("(any") >= 0 && x.split(" (")[0] === e.skill.toLowerCase());
      });
      if (hit && e.pts >= (c.points || 1)) return true;
      if (c.expertise.some(function(x){ return x.split(" (")[0].toLowerCase() === e.skill.toLowerCase(); })) any = true;
    }
    return any ? null : false;
  }
  if (c.mastery) {
    var els = elementMasteries();
    return els.indexOf(c.mastery) >= 0 ? true : null;
  }
  if (c.hasSpell) {
    for (var n2 in C.ownedNames) { if ((C.ownedNames[n2].keywords || []).indexOf("Spell") >= 0) return c.damaging ? null : true; }
    return false;
  }
  if (c.proficiency) return profCheck(c.proficiency, C);
  return null; // mystic eye slots and anything new: check yourself
}
function earlyAscension(){ return hasBt("early-ascension") ? 1 : 0; }
function elementMasteries(){
  var a = [];
  B.bts.forEach(function(b){ if (b.id === "elemental-affinity" && b.pick && b.pick.element) a.push(b.pick.element); });
  if (B.subrace === "ryujin" && B.raceChoice.element) a.push(B.raceChoice.element);
  return a;
}
function classStatus(id, C){
  var res = { state: "met", text: null, why: "" };
  var q = REQS[id];
  if (q) res.text = q.text;
  var u = raceUnlock(id);
  if (u) { res.state = "met"; res.why = "Unlocked by " + u.via; return res; }
  if (btGrants("classUnlocked").some(function(x){ return x.g.classUnlocked === id; })) { res.why = "Unlocked by breakthrough"; return res; }
  if (!q || !q.routes || !q.routes.length) return res;
  var best = "no";
  q.routes.forEach(function(route){
    var vals = route.map(function(c){ return condCheck(c, C); });
    var st = vals.indexOf(false) >= 0 ? "no" : (vals.indexOf(null) >= 0 ? "check" : "met");
    if (st === "met") best = "met"; else if (st === "check" && best !== "met") best = "check";
  });
  res.state = best;
  return res;
}

/* ---------- Breakthroughs ---------- */
function btBlockers(r){
  var why = [];
  if (r.race && r.race.length && !r.race.some(function(x){ return raceIds().indexOf(x) >= 0; })) why.push("race");
  if (r.restricted && !B.canon) why.push("restricted (tick Canon campaign)");
  if (!r.repeatable && !r.costScale && !r.costNote && hasBt(r.id)) why.push("already taken");
  if (r.requiresBreakthrough && !hasBt(r.requiresBreakthrough)) why.push("needs " + (BTS[r.requiresBreakthrough] ? BTS[r.requiresBreakthrough].name : r.requiresBreakthrough));
  var nth = B.bts.filter(function(b){ return b.id === r.id; }).length;
  if (btCostAt(r.id, nth) > expAvailFor("bt")) why.push("not enough EXP");
  return why;
}

/* ---------- Proficiencies ---------- */
var PROF = { groups: LC.weaponGroups || [], armor: LC.armorGroups || [], sets: LC.profSets || {}, grants: LC.profGrants || [] };
function profList(from){ return Array.isArray(from) ? from : (PROF.sets[from] || []); }
// Every grant that applies to this build right now, with a key for saving its picks.
function activeProfGrants(){
  var out = [], ids = raceIds();
  PROF.grants.forEach(function(g){
    var p = g.source.split(":"), t = p[0], id = p[1];
    if (t === "race" && ids.indexOf(id) >= 0) out.push({ g: g, key: g.source, label: (RACES[id] || {}).name + " (race)" });
    if (t === "clan" && B.race === "demon" && B.raceChoice.clan === id) out.push({ g: g, key: g.source, label: "Demon clan " + id });
    if (t === "class") {
      B.classes.forEach(function(c){
        var rec = CLASSES[c.id]; if (c.id !== id || !rec) return;
        var i = rec.steps.map(function(s){ return s.ability; }).indexOf(g.ability);
        if (i >= 0 && c.owned[i]) out.push({ g: g, key: g.source, label: rec.name + " — " + (rec.abilities[g.ability] || {}).name });
      });
    }
    if (t === "bt") {
      var n = 0;
      B.bts.forEach(function(b, idx){
        if (b.id !== id) return; n++;
        out.push({ g: g, key: "bt:" + idx, label: (BTS[id] || {}).name + (n > 1 ? " #" + n : "") });
      });
    }
  });
  return out;
}
function calcProfs(C){
  C.profs = {}; C.profSlots = []; C.profNotes = []; C.profOpenSlots = 0;
  var keep = {};
  activeProfGrants().forEach(function(a){
    (a.g.fixed || []).forEach(function(n){ (C.profs[n] = C.profs[n] || []).push(a.label); });
    (a.g.choose || []).forEach(function(ch, j){
      var k = a.key + "#" + j, picks = (B.profPicks[k] || []).slice(0, ch.n); keep[k] = 1;
      picks.forEach(function(n){ if (n) (C.profs[n] = C.profs[n] || []).push(a.label); });
      var open = ch.n - picks.filter(Boolean).length; C.profOpenSlots += open;
      C.profSlots.push({ key: k, label: a.label, text: ch.label, n: ch.n, options: profList(ch.from), picks: picks });
    });
    if (a.g.note) C.profNotes.push(a.label + ": " + a.g.note);
  });
  for (var k in B.profPicks) if (!keep[k]) delete B.profPicks[k];  // forget picks from removed classes/breakthroughs
  if (C.profOpenSlots) C.warn.push(C.profOpenSlots + " proficienc" + (C.profOpenSlots > 1 ? "ies" : "y") + " still to pick (Proficiencies section).");
  B.items.forEach(function(e){
    var it = ITEMS[e.id]; if (!it || !e.equipped || !it.armor) return;
    var need = itemProf(it);
    if (need && !C.profs[need]) C.warn.push("Not proficient with " + need + " (" + it.name + "): the rulebook gives non-proficient armor and shields a Guard and Evasion penalty.");
  });
}
// Which proficiency an item needs (or null).
function itemProf(it){
  if (LC.itemProfById && LC.itemProfById[it.id]) return LC.itemProfById[it.id];
  if (it.weapon && it.weapon.group) {
    var g = String(it.weapon.group).replace(/\s*\(.*\)$/, "");
    return (LC.itemGroupMap || {})[it.weapon.group] || (LC.itemGroupMap || {})[g] || null;
  }
  return null;
}
// Requirement names -> our names ("Longsword" -> "Longswords", "Thrown" -> "Thrown Weapons", ...)
function profName(x){
  var all = PROF.groups.map(function(g){ return g.name; }).concat(PROF.armor), l = x.toLowerCase();
  for (var i = 0; i < all.length; i++) {
    var a = all[i].toLowerCase();
    if (a === l || a === l + "s" || a === l + "es" || a.replace(/ weapons?$/, "") === l || a.split(" ")[0] === l) return all[i];
  }
  return x;
}
function profCheck(list, C){
  var want = [];
  list.forEach(function(x){
    if (x === "ANY_WEAPON") want = want.concat(PROF.groups.map(function(g){ return g.name; }));
    else if (x === "ANY_MELEE") want = want.concat(PROF.groups.filter(function(g){
      return ["common-melee", "artisan"].indexOf(g.kind) >= 0 || ["Lances", "Whips", "Gauntlets", "Saboteur Thread Daggers", "Staves"].indexOf(g.name) >= 0; }).map(function(g){ return g.name; }));
    else if (x === "ANY_TWO_HANDED_MELEE") want = want.concat(PROF.groups.filter(function(g){ return g.twoHanded && g.kind !== "other"; }).map(function(g){ return g.name; }));
    else want.push(profName(x));
  });
  if (want.some(function(n){ return C.profs[n]; })) return true;
  // an unfilled pick that could be one of these -> can't say yet
  var could = C.profSlots.some(function(s){ return s.picks.filter(Boolean).length < s.n && s.options.some(function(o){ return want.indexOf(o) >= 0; }); });
  return could ? null : false;
}

      render(); openDetail(detailNow);  // refresh the window so it shows the new state
    };
  });
}
function closeDetail(){ $("detail").classList.remove("open"); detailNow = null; }
$("detail").addEventListener("click", function(e){ if (e.target === this) closeDetail(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeDetail(); });
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-info]") : null;
  if (el) { e.preventDefault(); openDetail(el.dataset.info); }
});

/* ---------- Keyword pop-ups (tap or hover a keyword tag) ---------- */
// Finds the keyword for a tag like "Burning 5", "Persist 2" or "Stagger X".
function findKeyword(tag){
  var base = String(tag).toLowerCase().replace(/\s+(\d+|x)$/, "").trim();
  for (var id in KEYWORDS) if (KEYWORDS[id].name.toLowerCase() === base) return KEYWORDS[id];
  return null;
}
function kwTag(k){
  var kw = findKeyword(k);
  if (!kw) return '<span class="tag" title="Descriptor tag (no keyword page on the site)">' + esc(k) + "</span>";
  return '<span class="tag kw" data-kw="' + esc(kw.id) + '" data-kwlabel="' + esc(k) + '">' + esc(k) + "</span>";
}
var kwPinned = null;
function showKw(el){
  var kw = KEYWORDS[el.dataset.kw]; if (!kw) return;
  var pop = $("kwPop");
  pop.innerHTML = "<b>" + esc(el.dataset.kwlabel) + "</b>" + listHtml(kw.rules);
  pop.style.display = "block";
  var r = el.getBoundingClientRect(), w = pop.offsetWidth, hgt = pop.offsetHeight;
  var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  var y = r.bottom + 6; if (y + hgt > window.innerHeight - 8) y = Math.max(8, r.top - hgt - 6);
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hideKw(){ $("kwPop").style.display = "none"; kwPinned = null; }
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-kw]") : null;
  if (el) { if (kwPinned === el) { hideKw(); return; } showKw(el); kwPinned = el; e.stopPropagation(); return; }
  if (!e.target.closest || !e.target.closest("#kwPop")) hideKw();
});
document.addEventListener("mouseover", function(e){
  var el = e.target.closest ? e.target.closest("[data-kw]") : null;
  if (el && !kwPinned) showKw(el);
});
document.addEventListener("mouseout", function(e){
  var el = e.target.closest ? e.target.closest("[data-kw]") : null;
  if (el && !kwPinned) $("kwPop").style.display = "none";
});
window.addEventListener("scroll", hideKw, true);

/* =====================================================================
   4. SAVE / LOAD / RESET
   ===================================================================== */
$("btnSave").onclick = function(){
  var blob = new Blob([JSON.stringify(B, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lyrian-build-" + ((B.name || "unnamed").replace(/[^a-z0-9]+/gi, "-").toLowerCase()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
};
$("btnLoad").onclick = function(){ $("fileLoad").click(); };
$("fileLoad").onchange = function(){
  var f = this.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try { B = fixBuild(JSON.parse(rd.result)); render(); }
    catch (e) { alert("That file couldn't be read as a planner save."); }
  };
  rd.readAsText(f); this.value = "";
};
$("btnReset").onclick = function(){
  if (confirm("Start a new empty build? (Save first if you want to keep this one.)")) { B = newBuild(); render(); }
};

   5. START
   ===================================================================== */
(function start(){
  var missing = [];
  if (!Object.keys(CLASSES).length) missing.push("data/classes.js");
  if (!Object.keys(RACES).length) missing.push("data/races.js");
  if (!Object.keys(BTS).length) missing.push("data/breakthroughs.js");
  if (!Object.keys(REQS).length) missing.push("data/requirements.js");
  if (!Object.keys(ITEMS).length) missing.push("data/items.js");
  if (!Object.keys(KEYWORDS).length) missing.push("data/keywords.js");
  if (!(LC.profGrants || []).length) missing.push("data/proficiencies.js");
  if (missing.length) $("dataErr").innerHTML = '<div class="errbox">Couldn\'t load: ' + missing.join(", ") + '. Keep planner.html next to the "data" folder.</div>';
  var any = Object.values(CLASSES)[0];
  $("dataVer").textContent = "Data v" + (any ? any.version : "?") + " · " + Object.keys(CLASSES).length + " classes · " +
    Object.keys(ITEMS).length + " items";
  render();
})();
</script>
